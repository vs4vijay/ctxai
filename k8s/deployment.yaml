apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctxai
  namespace: ctxai
  labels:
    app: ctxai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ctxai
  template:
    metadata:
      labels:
        app: ctxai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      containers:
        - name: ctxai
          image: ctxai:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: CTXAI_HOME
              value: /data
            - name: CTXAI_ENV
              value: prod
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ctxai-secrets
                  key: openrouter-api-key
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ctxai-data
