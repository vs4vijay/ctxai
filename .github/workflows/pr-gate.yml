name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for same PR
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    name: Quick Checks (Lint + Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Lint with Ruff
        run: |
          uv run ruff check . --output-format=github

      - name: Run unit tests (no E2E)
        run: |
          uv run pytest tests/ -v \
            --ignore=tests/e2e/ \
            --cov=ctxai \
            --cov-report=term-missing \
            --cov-report=xml \
            -m "not slow"

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: pr-unit-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quick-checks  # Only run if quick checks pass
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run E2E tests
        run: |
          uv run pytest tests/e2e/ -v \
            --cov=ctxai \
            --cov-report=xml \
            --cov-append

      - name: Upload E2E coverage
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: e2e
          name: pr-e2e-tests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run Bandit security scan
        run: uv run bandit -r src/ -f json -o bandit-report.json

      - name: Upload security results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Export locked requirements
        run: |
          uv export --format requirements-txt --no-hashes --all-extras --no-emit-project \
            -o requirements-audit.txt

      # pip-audit runs from an ephemeral tool environment (uvx) so it never
      # enters the project venv. It exits non-zero when a known-vulnerable
      # pinned dependency is found, failing the gate.
      - name: Run pip-audit vulnerability scan
        run: |
          uvx pip-audit --progress-spinner off --no-deps \
            -f json -o pip-audit-report.json \
            -r requirements-audit.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
