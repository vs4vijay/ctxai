[project]
name = "ctxai"
version = "1.0.0"
description = "Production-ready AI coding agent with semantic search, MCP server, REST/WS API, and export tooling"
authors = [{ name = "vs4vijay", email = "vs4vijay@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "chromadb>=0.5.0",
    "pathspec>=0.12.1",
    "pydantic>=2.11.10",
    "pydantic-ai>=1.0.15",
    "python-dotenv>=1.1.1",
    "requests>=2.31.0",
    "rich>=13.9.4",
    "sentence-transformers>=3.3.1",
    "tomlkit>=0.13.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=0.9.0",
    "typer>=0.19.2",
]

[project.optional-dependencies]
openai = [
    "openai>=1.58.1",
]
dashboard = [
    "python-fasthtml>=0.9.3",
]
mcp = [
    "mcp>=1.16.0",
]
server = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "httpx>=0.27.0",
]
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
all = [
    "openai>=1.58.1",
    "python-fasthtml>=0.9.3",
    "mcp>=1.16.0",
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "httpx>=0.27.0",
]

[project.scripts]
ctxai = "ctxai.__main__:app"
ctxai-service = "ctxai.service.api_server:run"

[project.entry-points."ctxai.plugins"]
# Reserved entry-point group. Third-party plugins should advertise
# themselves here so PluginManager.discover_entry_points() picks them up.

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.13.3",
    "twine>=6.2.0",
]
mcp = [
    "mcp>=1.16.0",
]
server = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
]

[tool.uv]
default-groups = [
    "dev",
    "mcp",
    "server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxai", "src/ctxai_core"]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  "F841", # Unused variable
  "F401", # Unused imports
]
