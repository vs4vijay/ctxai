[project]
name = "ctxai"
version = "0.0.2"
description = ""
authors = [{ name = "vs4vijay", email = "vs4vijay@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = [
    "chromadb>=0.5.0",
    "mcp>=1.16.0,<1.17",
    "pathspec>=0.12.1",
    "prompt-toolkit>=3.0.48",
    "python-fasthtml>=0.9.3",
    "pydantic>=2.11.10",
    "pydantic-ai>=1.0.15",
    "python-dotenv>=1.1.1",
    "requests>=2.31.0",
    "rich>=13.9.4",
    "sentence-transformers>=3.3.1",
    "tomlkit>=0.13.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=0.9.0",
    "typer>=0.19.2",
]

[project.optional-dependencies]
openai = [
    "openai>=1.58.1",
]
dashboard = [
    "python-fasthtml>=0.9.3",
]
mcp = [
    "mcp>=1.16.0,<1.17",
]
all = [
    "openai>=1.58.1",
    "python-fasthtml>=0.9.3",
    "mcp>=1.16.0,<1.17",
]

[project.scripts]
ctxai = "ctxai.__main__:app"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "mypy>=2.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.13.3",
    "twine>=6.2.0",
]
mcp = [
    "mcp>=1.16.0,<1.17",
]
server = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
]

[tool.uv]
default-groups = [
    "dev",
    "mcp",
    "server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = [
    "src/ctxai/agent/approvals.py",
    "src/ctxai/agent/checkpoints.py",
    "src/ctxai/agent/costing.py",
    "src/ctxai/agent/editing.py",
    "src/ctxai/agent/events.py",
    "src/ctxai/agent/llm/contract.py",
    "src/ctxai/agent/resilience.py",
    "src/ctxai/agent/run_recorder.py",
    "src/ctxai/agent/tools/execution.py",
    "src/ctxai/agent/tools/output_limits.py",
    "src/ctxai/agent/tools/sandbox.py",
    "src/ctxai/agent/workflow.py",
    "src/ctxai/index_manifest.py",
    "src/ctxai/repository_context.py",
    "src/ctxai/retrieval_eval.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
